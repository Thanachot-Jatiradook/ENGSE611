<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Example for coding with JS on HTML</h1>

    <button onclick="showMessage()">Click for info</button>

    <script>
        function showMessage() {
            alert("Hi, this is message from JS in <script> tag");
        }

        console.log("Code in <script> are working");
    </script>

    <h1>Example for link JS file out side HTML</h1>
    <button id="btn">Click here</button>
    <script src="button.js"></script>
</body>
</html>
