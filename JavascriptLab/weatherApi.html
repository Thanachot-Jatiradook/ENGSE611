<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <button id="loadWeather">load weather info</button>
    <pre id="result">press button for loaing info</pre>

    <script>
        const button = document.getElementById("loadWeather");
        const result = document.getElementById("result");

        button.addEventListener("click", async () => {

            const url =
                "https://api.open-meteo.com/v1/forecast" +
                "?latitude=18.878&longitude=99.136" +
                "&current=temperature_2m,relative_humidity_2m,wind_speed_10m"; 
            
            try {

                const response = await fetch(url);

                if (!response.ok) {
                    throw new Error("can't connect to API");
                }

                const data = await response.json();

                const weather = data.current;

                result.textContent = 
                    "สถานที่ : อำเภอดอยสะเก็ด จังหวัดเชียงใหม่\n" +
                    "อุณหภูมิ : " + weather.temperature_2m + " °C\n" +
                    "ความชื้น : " + weather.relative_humidity_2m + " %\n" +
                    "ความเร็วลม : " + weather.wind_speed_10m + " km/h\n" +
                    "เวลา : " + weather.time;

                console.log(data);
            } catch(error){
                result.textContent = "error : " + error.message;
            }
        });
    </script>
</body>
</html>
